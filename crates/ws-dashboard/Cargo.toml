[package]
name = "ws-dashboard"
version = "0.1.0"
edition = "2021"

[dependencies]
ws-core = { path = "../ws-core" }
gtk4 = "0.10"
libadwaita = { version = "0.8", features = ["v1_5"] }
glib = "0.21"
gio = "0.21"
cairo = { package = "cairo-rs", version = "0.21" }
plotters = "0.3"
plotters-cairo = "0.8"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"

[lints]
workspace = true
