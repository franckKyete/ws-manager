[package]
name = "ws-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ws"
path = "src/main.rs"

[dependencies]
ws-core = { path = "../ws-core" }
ws-tui = { path = "../ws-tui" }

clap = { version = "4.5", features = ["derive", "cargo"] }
tokio = { version = "1.36", features = ["full"] }

colored = "2.1"
comfy-table = "7.1"
anyhow = "1.0"
serde_json = "1.0"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3.10"

[lints]
workspace = true
