[package]
name = "ws-core"
version = "0.1.0"
edition = "2021"

[dependencies]
ws-tui = { path = "../ws-tui" }
fnug-vt100 = { path = "../vt100" }

serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = { version = "1.0", features = ["preserve_order"] }
yaml-edit = "0.3"

tokio = { version = "1.36", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "blocking", "multipart"] }

regex = "1.10"
lazy_static = "1.4"
globset = "0.4"
chrono = { version = "0.4", features = ["serde"] }

sha2 = "0.10"
hex = "0.4"
walkdir = "2.5"

colored = "2.1"
comfy-table = "7.1"
crossterm = "0.27"

notify = "6.1"
ignore = "0.4"
inotify = "0.10"
uuid = { version = "1", features = ["v4"] }
dirs = "5.0"
thiserror = "1.0"
anyhow = "1.0"
nix = { version = "0.28", features = ["process", "signal", "term", "fs"] }
libc = "0.2"
base64 = "0.22"
rusqlite = "0.32"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
lz4_flex = "0.11"



[dev-dependencies]
tempfile = "3.10"

[lints]
workspace = true
