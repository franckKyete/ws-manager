[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ws-manager"
version = "0.1.0"
description = "Multi-Repository Workspace Manager using Git Worktrees"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Franck Kibwe", email = "franck.kyete@gmail.com"}
]
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.scripts]
ws = "ws.cli:main"

[tool.setuptools.packages.find]
where = ["."]
