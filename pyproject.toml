[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "ws-manager"
version = "0.1.0"
description = "Multi-Repository Workspace Manager using Git Worktrees with Native Rust TUI"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Franck Kibwe", email = "franck.kyete@gmail.com"}
]
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.scripts]
ws = "ws.cli:main"

[tool.maturin]
manifest-path = "crates/ws-tui/Cargo.toml"
module-name = "ws._native"
python-source = "."
